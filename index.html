<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8d4de8">
<title>Octubre para Valen 🪐</title>
<style>
:root{--pink:#ff77b7;--hot:#ff4f9a;--purple:#8c52e8;--blue:#5f8cff;--ink:#fff7ff}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#160c2d;overflow-x:hidden}
body{background:
radial-gradient(circle at 15% 15%,#a94fd955,transparent 28%),
radial-gradient(circle at 85% 20%,#4d8dff44,transparent 30%),
linear-gradient(145deg,#170b30,#321050 48%,#101b49);}
#sky,.garden{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.65;animation:twinkle 2.8s infinite ease-in-out}
.flower{position:absolute;bottom:-50px;width:18px;height:18px;border-radius:50%;background:#ff78b7;box-shadow:0 0 18px #ff78b799;animation:floatUp linear infinite}
.flower:before,.flower:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#ff9aca}
.flower:before{left:-8px;top:2px} .flower:after{left:8px;top:-5px}
.flower i{position:absolute;width:15px;height:15px;border-radius:50%;background:#ffafd8;left:2px;top:8px}
@keyframes floatUp{to{transform:translateY(-115vh) rotate(420deg);opacity:0}}
@keyframes twinkle{50%{opacity:.15;transform:scale(.6)}}
@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.04)}}
main{position:relative;z-index:2;max-width:920px;margin:auto;padding:40px 18px 70px}
.hero{text-align:center;animation:rise .9s ease both}
.badge{display:inline-block;padding:8px 14px;border:1px solid #ffffff33;border-radius:999px;background:#ffffff10;backdrop-filter:blur(10px);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(2.5rem,9vw,5.8rem);line-height:.95;margin:18px 0 12px;text-shadow:0 0 35px #ff6dbb77}
h1 span{background:linear-gradient(90deg,#ff9dcc,#d9a5ff,#91c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{max-width:650px;margin:0 auto 28px;color:#f4ddfa;line-height:1.6}
.card{border:1px solid #ffffff25;background:#ffffff0e;backdrop-filter:blur(18px);border-radius:28px;box-shadow:0 25px 80px #0005;padding:20px;animation:rise 1s .15s ease both}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}
.day{min-height:76px;border:1px solid #ffffff18;border-radius:18px;background:linear-gradient(145deg,#ffffff12,#ffffff06);color:#fff;cursor:pointer;transition:.25s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;position:relative;overflow:hidden}
.day:hover:not(.locked){transform:translateY(-4px) scale(1.02);border-color:#ff9dcc88;box-shadow:0 12px 28px #ff62ad2b}

.heart-pop{position:relative;text-align:center;font-size:3.2rem;line-height:1;margin:2px 0 18px;animation:heartPop .8s cubic-bezier(.2,.8,.3,1) both;filter:drop-shadow(0 0 10px #ff4f9a88)}
.heart-pop::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;border:2px solid #ff8fc5;border-radius:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:heartRing .9s .12s ease-out both}
@keyframes heartPop{0%{opacity:0;transform:scale(.25) translateY(12px)}55%{opacity:1;transform:scale(1.18) translateY(0)}75%{transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
@keyframes heartRing{0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
.signature{margin:24px 0 2px;text-align:right;color:#ffc3e2;font-weight:700;font-size:1rem;text-shadow:0 0 12px #ff77b766}
.rose{width:30px;height:30px;position:relative;display:block;margin-bottom:1px;filter:drop-shadow(0 0 5px #ff315c55);transition:transform .25s ease,filter .25s ease;animation:roseAppear .55s ease both}
.rose::before{content:"";position:absolute;width:19px;height:19px;left:5px;top:3px;border-radius:50% 45% 55% 48%;background:radial-gradient(circle at 52% 50%,#7b001b 0 13%,transparent 14%),radial-gradient(circle at 35% 34%,#ff6b82 0 24%,transparent 25%),radial-gradient(circle at 67% 35%,#e31b45 0 31%,transparent 32%),radial-gradient(circle at 51% 68%,#b8002b 0 38%,#7e001c 39% 100%);transform:rotate(-12deg);box-shadow:0 0 7px #ff315c66}
.rose::after{content:"";position:absolute;width:7px;height:13px;left:12px;top:20px;background:linear-gradient(90deg,#276b3a,#62b85d);border-radius:2px 7px 2px 7px;transform:rotate(14deg);box-shadow:-6px 3px 0 -1px #39834a}
.day:hover:not(.locked) .rose{transform:scale(1.18) rotate(-3deg);filter:drop-shadow(0 0 9px #ff315c) drop-shadow(0 0 16px #ff8da2)}
@keyframes roseAppear{from{opacity:0;transform:scale(.55) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.day small{font-size:.7rem;opacity:.65}
.day.locked{cursor:not-allowed;opacity:.38;filter:saturate(.5)}
.day.unlocked{background:linear-gradient(145deg,#ff71b72b,#8e5be92b)}
.day.today{outline:2px solid #ffb6dd;box-shadow:0 0 25px #ff76bb66;animation:pulse 2s infinite}
.day.birthday{background:linear-gradient(145deg,#ff4f9a66,#a46bff55);border-color:#ffd0e8}
.note{text-align:center;color:#e9cfee;margin:16px 5px 0;font-size:.82rem}
footer{text-align:center;margin-top:30px;color:#c9b0d7;font-size:.8rem}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#080411aa;backdrop-filter:blur(12px)}
.modal.open{display:flex}
.dialog{position:relative;width:min(720px,100%);max-height:86vh;overflow:auto;border:1px solid #ffffff30;border-radius:30px;background:linear-gradient(145deg,#33104fee,#17143cf5);box-shadow:0 30px 100px #0009;padding:28px;animation:rise .35s ease both}
.close{position:absolute;right:15px;top:12px;border:0;background:#ffffff15;color:white;border-radius:50%;width:38px;height:38px;font-size:1.2rem;cursor:pointer}
.dialog h2{margin:0 45px 20px 0;font-size:1.55rem;color:#ffc3e2}
.message{font-size:1.05rem;line-height:1.85;color:#fff7ff}
.birthdayTitle{font-size:clamp(1.7rem,6vw,3rem);text-align:center;background:linear-gradient(90deg,#ff8fc5,#ffd1e9,#a8c7ff);-webkit-background-clip:text;color:transparent}
.heart{text-align:center;font-size:2.5rem;margin:5px 0 14px;animation:pulse 1.7s infinite}
@media(max-width:620px){main{padding:25px 11px 50px}.calendar{gap:6px}.day{min-height:61px;border-radius:14px;font-size:.95rem}.day small{font-size:.62rem}.card{padding:12px;border-radius:22px}.dialog{padding:23px 18px;border-radius:24px}.message{font-size:.98rem;line-height:1.75}}
</style>
</head>

<script>
const messages = {
1: 'Hoy empieza octubre y pensé que quería hacer algo especial contigo. Sé que te he dicho ya, pero no lo suficiente para mi, no sabes lo mucho que valoro y agradezco tenerte en mi vida, así que durante estos días quiero mostrartelo poquito a poquito 🩷\n\nSiempre es tan bello escucharte, se que puede ser exagerado pero esa alegría tuya y esa forma de ser tan bella son la mejor forma de comenzar el día !!',
2: 'Hay personas que uno se cruza por ahí y simplemente un día desparecen de la vida.\nY hay otras que, con el tiempo, se vuelven parte de vida de uno.\nTú eres de esas personas para mí, obviamente hablo de las segundas. Y aunque quizá no siempre encuentre la manera correcta de decirlo, tú mi Valen ya tienes un lugar super especial y unico en mi vida. 🩷',
3: 'Hoy pensé en algo curioso (si a pesar de que apenas van unos minutos y estoy medio dormido jaja): probablemente no te das cuenta de todas las pequeñas cosas que haces que pueden mejorarle el día a alguien, y ese alguien soy yo.\n\nUn mensajito de voz tan bello para empezar el día, una risa, un buen deseo o simplemente estar ahí…\n\nA veces uno deja huella sin siquiera intentarlo, cierto? \nY tú has dejado una muy bonita en mí.',
4: 'Sabes mi Valen? Ojalá pudieras verte alguna vez desde los ojos de las personas que te queremos.\nQuizá descubrirías que tienes muchas más cosas bonitas de las que tú misma alcanzas a ver.\nY si algún día se te olvida, espero que recuerdes que aquí hay alguien que sí las ve y que siempre estará intentando resaltartelas 🩷',
5: 'No todas las amistades necesitan estar llenas de conversaciones todos los días, aunque claro para mí tan bello el poder escucharte y leerte cada día.\n\nHay amistades que sobreviven al silencio, a la distancia, a los días complicados y a las etapas diferentes.\nLo bonito es saber que, aun después de todo eso, cuando vuelves a hablar con esa persona, algo sigue sintiéndose igual... Yo sería el más feliz si pudiera tenerte el resto de mi vida',
6: 'Hoy mi Valen solamente quiero darte las gracias.\nPor todas las veces que me has escuchado, por tus bellísimas notita de voz, por las fotitos tan tiernas, por las conversaciones inesperadas y hasta por esas pequeñas cosas que probablemente tú ya olvidaste pero que yo sí recuerdo.\nA veces las personas no saben cuánto significan hasta que alguien se los dice.\nAsí que aquí estoy diciéndotelo como cada día intento mostrarte lo que significa tenerte en mi vida 🩷',
7: 'Mi Valen quiero que tengas presente algo durante estos días:\nNo tienes que demostrarle tu valor a nadie, porque quien no lo vea no merece siquiera tenerte cerca.\nNo tienes que ser perfecta, nadie lo es aunque tú eres maravillosa! \nNo tienes que tener todo resuelto, la vida tiene que tener emoción y el camino siempre tendrá sorpresas y espero que muy bellas para ti.\nEres valiosa simplemente por ser quien eres.\nY para mí, eso siempre será perfecto!',
8: 'Si pudiera regalarte algo que no pudiera comprarse, te regalaría un par de cosas tranquilidad y felicidad.\nDe esa que hace que puedas dormir sin preocupaciones, despertar sin miedo y mirar hacia adelante con ilusión.\nPorque después de todo lo que la vida nos hace cargar y que últimamente te ha tocado pasar, creo que todos merecemos un poquito de paz.\nY tú mi Valen especialmente mereces todo lo bueno de este mundo !',
9: 'Me gusta recordar que nuestras vidas coincidieron y que por alguna razón apareciste cuando más lo necesitaba.\nDe todas las personas que existen, de todos los lugares, momentos y circunstancias…\nde alguna manera terminamos conociéndonos.\nY quizá parezca una cosa pequeña, pero para mí no lo es mi Valen, significa algo de lo más maravilloso de este año.\nPorque gracias a esa coincidencia hoy puedo decir que tengo una amiga a la que quiero muchísimo 🩷',
10: 'Ya van diez días de octubre.\nY mientras pasan los días, pienso que quizá el mejor regalo que puedo darte no es algo material, porque la distancia también me lo impide\nAsí que quiero recordarte algo que quizá necesitas escuchar de vez en cuando:\nEres importante.\nPara muchas personas, seguramente más de lo que imaginas.\nY para mí, definitivamente ya tienes un lugar muy especial en mi corazón 🩷',
11: 'Hay recuerdos que uno guarda sin saber exactamente por qué.\nUna conversación, una frase, una risa…\nY cuando vuelven a la memoria, producen esa sensación bonita de pensar:\n“Qué bueno que pasó”\nCuando pienso en ti, tengo varios recuerdos así.\nY espero que todavía nos queden muchísimos por construir... Se lo que lo repito mucho, pero de verdad quisiera tenerte en mi vida por siempre 🩷',
12: 'No sé cómo será tu vida dentro de algunos años.\nNo sé dónde estaremos, qué estaremos haciendo ni qué habrá cambiado.\nPero sí sé algo:\nme gustaría que, cuando miremos hacia atrás, podamos recordar esta etapa y decir:\n“Qué bonito fue coincidir.”\nPorque para mí, las cosas pasan de la forma que tenía que ser para poder convertirnos en quien hoy somos y seremos y definitivamente sé que este angelito que eres tú aprecio en mi vida por alguna buena razón 🩷',
13: 'A veces queremos muchísimo a las personas y asumimos que ellas lo saben.\nPero creo que no está de más decirlo, porque además me encanta demostrarlo\nAsí que hoy te lo digo:\nTe Quiero muchísimo mi Valen 🪐\nY quiero que sepas que tu presencia en mi vida es una bendición para mí 🩷',
14: 'Hay algo que me gusta mucho de nuestra amistad: que no necesito buscar una razón especial para pensar en ti mi Valen.\nA veces simplemente apareces en algún pensamiento, recuerdo alguna conversación, alguna cosita tuya o alguna de esas pequeñas cosas que me hacen sonreír.\nY creo que eso dice mucho de lo importante que se vuelve una persona para nosotros.\nTú eres una de esas personas que aparecen en mis pensamientos de una manera bonita.',
15: 'Llegamos a la mitad del mes.\nY creo que ya puedo confesarte algo:\nme está gustando mucho esta pequeña cuenta regresiva y estar inventando nuevas ideas para demostrar lo que significas para mí.\nY está idea me está dando una excusa para decirte cosas que quizá en un día cualquiera simplemente pensaría y dejaría pasar o quizás no, pero igual, al ser tu mes me sirve de justificación.\nY algunas cosas merecen ser dichas y me encanta decirte lo muchisimo que ya te quiero mi Valen 🩷',
16: 'Quizá una de las cosas que más valoro de ti es poder sentir que no tiengo que actuar.\nPuedo ser yo por lo bella que eres tú...\nY podemos hablar de cosas importantes o de las cosas más absurdas, reír, quejarnos.\nY saber que del otro lado hay alguien que te acepta como eres.\nGracias por permitirme tener eso contigo mi Valen 🩷',
17: 'Si pudiera pedir algo para ti, no pediría que nunca tuvieras problemas.\nEso sería imposible.\nPediría que siempre encuentres fuerzas para atravesarlos.\nQue cuando caigas haya alguien que te ayude a levantarte y para eso también estoy aquí.\nQue cuando estés perdida encuentres un camino y sino aquí estaré para acompañarte.\nY que cuando seas feliz tengas con quién compartirlo y espero estar ahí también.\nEso es lo que deseo para ti siempre mi Valen 🩷',
18: 'Faltan ya solo nueve días para el mejor día del año, cierto ?\nY cada vez que pienso en eso, me doy cuenta de que tu cumpleaños no solamente celebra que naciste.\nTambién celebra todas las vidas que has tocado desde entonces.\nEntre ellas, la mía.\nY sinceramente, me alegra muchísimo que hayas llegado a formar parte de ella... Te quiero mi Valen 🪐',
19: 'Hay personas que uno quiere por lo que hacen.\nY hay personas que uno quiere simplemente por quienes son.\nContigo me pasa un poco de ambas.\nMe gustan nuestras conversaciones, nuestros buenos días y nuestros momentos, pero también quiero esa versión tuya que quizá no todos conocen, la que tiene sus inseguridades, sus días malos, sus sueños y sus miedos.\nEsa también merece cariño. Y se que detrás de esa chica que avienta piedras está un ser tan hermoso que no todos pueden ver 🩷',
20: 'Faltan ya siete días nada más!!!\nY quiero que cuando llegue tu cumpleaños mi Valen no solamente recibas felicitaciones.\nQuiero que recibas cariño.\nDel verdadero.\nDel que no necesita una fecha especial para existir.\nPorque eso es lo que quiero que tengas siempre alrededor de ti... El cariño sincero es lo más bello del mundo !',
21: 'Ahora ya solo seis días más.\nY mientras se acerca tu cumpleaños, solo puedo pensar en lo curioso que es que una persona pueda convertirse en alguien tan importante sin que exista un momento exacto en el que eso suceda.\nSimplemente pasa.\nUn día te das cuenta y piensas:\n“Esta persona ya forma parte de mi vida.”\nEso me pasó contigo... Y doy gracias a dios por haberte encontrado mi Valen 🪐🩷',
22: 'Faltan ya solo cinco días.\nY si pudiera pedirte algo para este nuevo año de tu vida sería que seas un poquito más amable contigo misma.\nQue te exijas tanto y que reconozcas lo que has logrado.\nQue no minimices nunca tus cualidades.\nY que aprendas a mirarte con el mismo cariño con el que algunas personas te miramos... Si te pudieras ver cómo yo te veo sería perfecto 🩷',
23: 'Faltan cuatro días.\nYa casi llega ese día que probablemente para ti sea “mi cumpleaños”.\nPero para mí es también el día en que puedo celebrar que existe una persona que quiero muchísimo.\nAsí que sí…\npara mí tu cumpleaños demasiado especial mi Valen 🩷',
24: 'Tres días solamente...\nY quizá nunca te haya dicho esto de esta manera o quizás si:\nGracias por dejarme conocerte.\nNo solamente conocer la versión que todos ven, sino también esas pequeñas partes que aparecen cuando tienes confianza. Por qué si, no se si es mi imaginación pero siento que si confías en mí.\nGracias por las notitas de voz, por las conversaciones y por esos momentos que quizá para ti fueron normales, pero que para mí significaron demasiado... Apareciste en el momento exacto y toda la vida agradeceré por ello.',
25: 'Ufff solo dos días.\nY creo que ya puedo decirlo:\nTengo muchas ganas de que llegue tu cumpleaños.\nNo por la fiesta que no iré 😢, ni por la torta que no comeré 😔, ni por las felicitaciones que esas si te las daré.\nTengo ganas porque quiero que durante al menos un día todo el mundo te demuestre lo querida que eres mi Valen 🩷\nY porque quiero ser una de las personas que te lo demuestren más',
26: 'Mañana es el gran día día... Mañana al fin es tu cumpleaños.\nY este día previo quiero decirte solamente una cosa:\nSi alguna vez la vida te hace sentir que estás sola, que no eres suficiente o que no estás avanzando como quisieras, vuelve a leer estos mensajes.\nNo porque yo tenga todas las respuestas.\nSino porque quiero que recuerdes que, en algún lugar de tu camino, hubo alguien que te quiso muchísimo, que creyó en ti y que estuvo genuinamente feliz de haberte conocido.\nMañana es tu día.\nPero hoy quería decirte algo antes de que termine el mes:\ngracias por existir mi Valen 🪐 gracias por dejarme conocer a tan bello angelito que tú eres.',
27: 'Estas son las mañanitas que cantaba el rey David, hoy por ser tu cumpleaños te las canto a ti... despierta mi Valen despierta, mira que ya amaneció, ya los pajarillos cantan, la luna ya se metió....\n\nQue linda está la mañana en que vengo a saludar',
28: 'Ayer fue tu cumpleaños, pero creo que no quería que todo terminara simplemente con un “feliz cumpleaños”.\nPorque aunque el 27 era el día que quería celebrar tu vida, lo que siento por ti no desaparece cuando cambia la fecha.\nAsí que hoy solo quería recordarte algo:\nqué bonito es tenerte en mi vida.\nY qué bonito saber que, después de tantos momentos compartidos, todavía nos quedan muchos más por vivir',
29: 'Hoy ya no hay cuenta regresiva porque faltan muchos días, cierto ??\nYa pasó tu día, ya recibiste felicitaciones, seguramente hubo torta, mensajes, abrazos y buenos deseos…\nPero me quedé pensando en algo.\nOjalá todo ese cariño que recibiste ayer no se quede solamente en un día.\nOjalá puedas sentirlo también en los días normales, en los lunes cansados, en los momentos difíciles y en esas noches en las que simplemente necesitas recordar que eres importante.\nPorque lo eres para mi\nY espero poder recordártelo muy a menudo, solo espero no aburrirte con ello',
30: 'Creo que después de 30 días hay algo que puedo decir con absoluta certeza:\nme gustó mucho tener una excusa para escribirte todos estos días se que ya lo hacía normalmente, pero me gustó también darle un toque más allá de genuinamente interesarme por cómo estás, también me encantó intentar expresarte todo lo bella que eres para mí.\nPero la verdad es que no necesitaba octubre para hacerlo.\nPodría haberte escrito cualquier otro día.\nPodría decirte cualquier otro mes que te quiero muchísimo y que te valoro\nY seguramente seguiré encontrando pequeñas razones para recordártelo.\nPorque algunas personas simplemente merecen saber lo importantes que son',
31: 'Y llegamos al último día de octubre.\nEmpecé este mes pensando en cómo podía hacerte sentir especial durante tu cumpleaños y terminé descubriendo algo:\na veces uno empieza un detalle para alguien y termina dándose cuenta de cuánto significa esa persona para uno.\nAsí que quiero cerrar octubre diciéndote algo muy sencillo:\ngracias por haber formado parte de este mes, pero sobre todo, gracias por formar parte de mi vida.\nEspero que este mes haya dejado en ti algunos recuerdos bonitos.\nY si alguno de estos mensajes consiguió hacerte sonreír aunque fuera un poquito, entonces todo esto valió la pena.\nSe acabó octubre…\npero no se acaba el cariño, ni las conversaciones, ni las risas, ni todos esos momentos que todavía nos faltan.\nTe quiero muchísimo mi Valen 🩷'
};
const calendar = document.getElementById('calendar');
const modal = document.getElementById('modal');
const content = document.getElementById('content');
const close = document.getElementById('close');

function todayDay() {
  const now = new Date();
  return (now.getMonth() === 9) ? now.getDate() : 0;
}
function refreshLocks() {
  const today = todayDay();
  document.querySelectorAll('.day').forEach(btn => {
    const d = Number(btn.dataset.day);
    const unlocked = today >= d && today > 0;
    btn.classList.toggle('locked', !unlocked);
    btn.classList.toggle('unlocked', unlocked);
    btn.classList.toggle('today', unlocked && today === d);
    btn.querySelector('small').innerHTML = unlocked ? '<span class="rose" aria-hidden="true"></span>' : 'Próximamente…';
    btn.setAttribute('aria-disabled', String(!unlocked));
  });
}
function openDay(d) {
  const today = todayDay();
  if (!(today >= d && today > 0)) {
    content.innerHTML = '<div class="heart">🔒</div><h2>Próximamente…</h2><p class="message">Este día todavía no está disponible. Regresa cuando llegue su fecha 🩷</p>';
    modal.classList.add('open'); return;
  }
  const title = d === 27 ? '🎂 Feliz cumpleaños, mi Valen 🪐' : `Día ${d}`;
  content.innerHTML = `<div class="heart-pop" aria-hidden="true">🩷</div><div class="${d===27?'birthdayTitle':''}">${title}</div><div class="message">${messages[d].replace(/\n/g,'<br>')}</div><div class="signature">🪐luisito</div>`;
  modal.classList.add('open');
}
document.querySelectorAll('.day').forEach(btn => btn.addEventListener('click', () => openDay(Number(btn.dataset.day))));
close.addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if(e.target===modal) modal.classList.remove('open'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') modal.classList.remove('open'); });
refreshLocks();

const sky = document.getElementById('sky');
for(let i=0;i<90;i++) {
  const s=document.createElement('i'); s.className='star';
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*3)+'s'; s.style.opacity=(.25+Math.random()*.7);
  sky.appendChild(s);
}
const garden = document.getElementById('garden');
for(let i=0;i<125;i++) {
  const f=document.createElement('span'); f.className='flower';
  f.innerHTML='<i></i>';
  f.style.left=Math.random()*100+'%';
  f.style.animationDuration=(12+Math.random()*18)+'s';
  f.style.animationDelay=(-Math.random()*25)+'s';
  f.style.transform=`scale(${.45+Math.random()*.9})`;
  garden.appendChild(f);
}
setInterval(refreshLocks, 60000);
</script>
